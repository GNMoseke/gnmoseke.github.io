<extend template="base.shtml">
<head id="head">
  <style>
    .description,
    .date {
      font-size: 0.8em;
    }
    
    .title h3{
      margin-top: 0;
      margin-bottom: 0;
    }
  </style>
</head>
<body id="body">
  <h1 :text="$page.title"></h1>
  <div :html="$page.content()"></div>
    <div>
      <h2>Pinned Posts - Things I'm Proud Of</h2>
        <div :loop="$site.page('blog').subpages()">
          <span class="date" :text="$loop.it.date.format('January 02, 2006')" :if="$loop.it.custom.has('pinned')"></span>
          <a class="title" href="$loop.it.link()" :if="$loop.it.custom.has('pinned')">
            <h3 :text="$loop.it.title"></h3>
          </a>
          <p class="description" :text="$loop.it.description" :if="$loop.it.custom.has('pinned')"></p>
        </div>
    </div>
</body>
