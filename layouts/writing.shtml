<extend template="base.shtml">
<head id="head">
  <style>
    #prev-next {
     display: flex;
     flex-direction: row;
     justify-content: space-between;
     margin-top: 40px;
    }

    figure {
      align-self: center;
      text-align: center;
      font-style: italic;
    }

    .post {
      display:flex;
      flex-direction: column;
    }
  </style>
</head>
<body id="body">
  <h1 :text="$page.title"></h1>
  <div class="post" :html="$page.content()"></div>
  <small class="date" :text="$page.date.format('January 02, 2006')"></small>
</body>
